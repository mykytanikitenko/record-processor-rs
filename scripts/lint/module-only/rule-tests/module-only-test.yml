id: module-only
valid:
  - "mod a;"
  - "pub mod a;"
  - "pub(crate) mod a;"
  - "mod a;\nmod b;\nmod c;"
  - "use foo::Bar;"
  - "pub use foo::Bar;"
  - "pub(crate) use foo::Bar;"
  - "extern crate foo;"
  - "//! crate documentation"
  - "// plain comment\nmod a;"
  - "/* block comment */\nmod a;"
  - "#![allow(dead_code)]\nmod a;"
  - "#![deny(warnings)]\n#![forbid(unsafe_code)]"
  - "#[cfg(feature = \"x\")]\npub mod a;"
  - "/// doc on the module\nmod a;"
  - "#[doc(inline)]\npub use foo::Bar;"
  - "#[cfg(test)]\npub mod a;"
  - "pub use error::Error;\npub use run::run;"
invalid:
  - "fn f() {}"
  - "pub fn f() {}"
  - "async fn f() {}"
  - "struct S;"
  - "pub struct S;"
  - "enum E {}"
  - "union U {}"
  - "impl S {}"
  - "impl S { fn m(&self) {} }"
  - "trait T {}"
  - "const C: i32 = 0;"
  - "static S: i32 = 0;"
  - "type A = B;"
  - "macro_rules! m { () => {} }"
  - "foo!();"
  - "extern \"C\" { fn c(); }"
  - "mod tests {}"
  - "mod tests { fn helper() {} }"
  - "mod d { }"
  - "#[cfg(test)]\nmod tests {}"
  - "#[cfg(test)]\nmod tests {\n    fn helper() {}\n}"
