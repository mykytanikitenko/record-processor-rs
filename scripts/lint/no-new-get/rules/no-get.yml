id: no-get
language: Rust
severity: error
message: "expose newtype contents through `derive_more::Deref` (read-only) instead getter functions"
rule:
  any:
    - kind: function_item
      has:
        field: name
        regex: '^get(_|$)'
    - kind: function_signature_item
      has:
        field: name
        regex: '^get(_|$)'
