id: alloc-pattern
valid:
  - "let x = 5u32;"
  - "let s: &str = &owned;"
  - "let y = &x;"
  - "fn f(a: u8) -> u8 { a }"
  - "let it = (0..10).into_iter();"
invalid:
  - "Vec::new()"
  - "Vec::with_capacity(4)"
  - "VecDeque::new()"
  - "HashMap::new()"
  - "BTreeMap::new()"
  - "HashSet::new()"
  - "BTreeSet::new()"
  - "Box::new(x)"
  - "Box::pin(async {})"
  - "String::new()"
  - "String::from(\"x\")"
  - "String::with_capacity(4)"
  - "Rc::new(x)"
  - "Arc::new(x)"
  - "vec![1, 2, 3]"
  - "format!(\"{x}\")"
  - "it.collect()"
  - "it.collect::<Vec<_>>()"
  - "sl.to_vec()"
  - "v.into_boxed_slice()"
