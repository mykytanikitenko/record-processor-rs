id: pretty-assertions
language: Rust
severity: error
message: "`$M!` is a panicking assertion macro. Replace with an error-returning comparison (return a `Result` and use `?`)."
rule:
  pattern: $M!($$$)
constraints:
  M:
    regex: "(^|::)(pretty_assertions_sorted|pretty_assertions)::(assert_eq|assert_ne|assert_eq_sorted)$"
