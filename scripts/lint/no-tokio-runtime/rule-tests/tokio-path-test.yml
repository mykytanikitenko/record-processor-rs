  - "tokio::fs::read_to_string(\"x\")"
  - "tokio::process::Command::new(\"x\")"
  - "tokio::signal::ctrl_c()"
  - "tokio::select!{}"
  - "tokio::join!{}"
  - "tokio::try_join!{}"
  - "use tokio::time;"
  - "use tokio::runtime::Runtime;"
  - "#[tokio::main]\nasync fn main() {}"
  - "#[tokio::test]\nasync fn t() {}"
