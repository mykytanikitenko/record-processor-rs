id: fallback-methods
language: Rust
severity: error
message: "silent fallback substitutes a value where the missing/error case must propagate as a typed error (use `.ok_or(..)?`, `.ok_or_else(..)?`, or `.context(..)?`)"
rule:
  any:
    - pattern: $X.unwrap_or($$$)
    - pattern: $X.unwrap_or_default()
    - pattern: $X.unwrap_or_else($$$)
    - pattern: $X.map_or($$$)
    - pattern: $X.map_or_else($$$)
    - pattern: $X.or($$$)
    - pattern: $X.xor($$$)
    - pattern: $T::unwrap_or($$$)
    - pattern: $T::unwrap_or_default($$$)
    - pattern: $T::unwrap_or_else($$$)
    - pattern: $T::map_or($$$)
    - pattern: $T::map_or_else($$$)
    - pattern: $T::or($$$)
    - pattern: $T::xor($$$)
