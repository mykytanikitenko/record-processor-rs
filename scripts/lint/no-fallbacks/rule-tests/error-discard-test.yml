id: error-discard
valid:
  - "let e = r.err().context(\"x\")?;"
  - "let e = r.err().with_context(|| \"x\")?;"
  - "let e = r.err().ok_or(E)?;"
  - "let e = r.err().ok_or_else(|| E)?;"
  - "let v = opt.is_some();"
  - "let v = opt.is_none();"
invalid:
  - "r.err()"
  - "r.err().is_some()"
  - "r.ok()"
  - "r.is_ok()"
  - "r.is_err()"
  - "Result::ok(r)"
  - "Result::err(r)"
  - "Result::is_ok(r)"
  - "Result::is_err(r)"
  - "x.filter(Result::is_ok)"
  - "x.filter_map(Result::ok)"
  - "x.flatten()"
  - "Result::flatten(x)"
  - "match r { Ok(v) => v, Err(_) => 0 }"
  - "if let Ok(v) = r {}"
  - "while let Ok(v) = r {}"
  - "catch_unwind(|| {})"
  - "std::panic::catch_unwind(|| {})"
  - "Err(())"
  - "let x: Result<u8, ()> = Ok(1);"
