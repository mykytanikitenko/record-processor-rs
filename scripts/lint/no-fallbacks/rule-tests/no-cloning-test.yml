id: no-cloning
valid:
  - "let y = &x;"
  - "let s: &str = &owned_string;"
  - "tracker.clone()"
  - "self.tracker.clone()"
  - "foo_tracker.clone()"
invalid:
  - "a.to_owned()"
  - "a.to_string()"
  - "a.clone()"
  - "ToOwned::to_owned(a)"
  - "ToString::to_string(a)"
  - "Clone::clone(&a)"
  - "x.map(ToOwned::to_owned)"
  - "x.map(ToString::to_string)"
  - "String::clone(&s)"
